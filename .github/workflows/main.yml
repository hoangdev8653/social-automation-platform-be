name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }} # IP của Server
          username: ${{ secrets.VPS_USERNAME }} # Thường là root
          key: ${{ secrets.SSH_PRIVATE_KEY }} # Private Key để đăng nhập
          port: 22
          script: |
            cd ~/services/social-automation-platform-be
            git reset --hard HEAD
            git checkout main
            git pull origin main
            docker compose up -d --build
            docker image prune -f
